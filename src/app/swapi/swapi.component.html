<div class="swapi">
  <h1>Star Wars API</h1>

  <div class="botones">
    <button *ngFor="let r of recursos" (click)="cargar(r.clave)" [class.activo]="r.clave === recursoActivo">
      {{ r.etiqueta }}
    </button>
  </div>

  <div *ngIf="datos">
    <p>Total: {{ datos.count }} | Página: {{ pagina }}</p>

    <div class="cards">
      <div class="card" *ngFor="let item of datos.results">
        <div *ngFor="let clave of claves(item)">
          <strong>{{ clave }}:</strong> {{ item[clave] }}
        </div>
      </div>
    </div>

    <div class="paginacion">
      <button (click)="anterior()" [disabled]="!datos.previous">Anterior</button>
      <button (click)="siguiente()" [disabled]="!datos.next">Siguiente</button>
    </div>
  </div>
</div>
